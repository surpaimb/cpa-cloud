[workspace]
members = ["crates/employee-config-core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.90"

[workspace.dependencies]
hex = "=0.4.3"
dirs = "=6.0.0"
json-five = "=0.3.1"
json5 = "=0.4.1"
libc = "=0.2.190"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
sha2 = "=0.10.9"
tauri = { version = "=2.12.3", features = [] }
tauri-build = { version = "=2.7.2", features = [] }
thiserror = "=2.0.17"
toml_edit = "=0.22.27"
url = "=2.5.7"
zeroize = { version = "=1.8.2", features = ["serde"] }
windows-sys = "=0.61.2"
