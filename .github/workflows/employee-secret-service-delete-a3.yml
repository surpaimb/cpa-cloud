name: Employee Secret Service exact deletion A3

on:
  pull_request:
    paths:
      - 'desktop/employee-config-switcher/**'
      - '.github/workflows/employee-secret-service-delete-a3.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/employee-config-switcher/**'
      - '.github/workflows/employee-secret-service-delete-a3.yml'

permissions:
  contents: read

concurrency:
  group: secret-service-a3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-deletion-and-durable-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Public no-key, volatile, A2 and A3 guards
        run: |
          python3 -B desktop/employee-config-switcher/preflight/test_preflight.py
          python3 -B desktop/employee-config-switcher/interop/test_fixture.py
          python3 -B desktop/employee-config-switcher/interop-a2/test_fixture.py
          python3 -B desktop/employee-config-switcher/interop-a3/test_fixture.py
      - name: Install exact real components (missing versions fail)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          mapfile -t pins < <(python3 -c 'import json; d=json.load(open("desktop/employee-config-switcher/preflight/components.json")); print("\n".join(k+"="+v["version"] for k,v in d.items()))')
          test "${#pins[@]}" -eq 4
          sudo apt-get install --no-install-recommends -y "${pins[@]}" gcc pkg-config libdbus-1-dev
      - name: Compile independent verifier (warnings are errors)
        run: cc -std=c11 -Wall -Wextra -Werror desktop/employee-config-switcher/interop-a3/verifier.c -o "$RUNNER_TEMP/cpa-a3-verifier-check" $(pkg-config --cflags --libs libsecret-1)
      - name: Compile actual CPA provider test executable
        working-directory: desktop/employee-config-switcher
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --locked -p employee-config-core --lib --no-run --message-format=json > "$RUNNER_TEMP/cpa-a3-build.jsonl"
      - name: Retained fake-backend and native filesystem regression (not daemon acceptance)
        working-directory: desktop/employee-config-switcher
        shell: bash
        run: |
          set -euo pipefail
          for module in linux_secret_service recovery_key cleanup_journal completion_tombstone workspace_removal workspace_retirement linux_replacement; do
            cargo +1.90.0 test --locked -p employee-config-core --lib "live::${module}::tests::" -- --test-threads=1
          done
      - name: Explicit isolated real daemon and real process-crash A3 (first red stops)
        shell: bash
        run: |
          set -euo pipefail
          binary=$(python3 desktop/employee-config-switcher/interop/select_binary.py "$RUNNER_TEMP/cpa-a3-build.jsonl")
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 -B desktop/employee-config-switcher/interop-a3/fixture.py "$binary"
