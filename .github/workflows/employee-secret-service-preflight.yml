name: Employee Secret Service no-key preflight

on:
  pull_request:
    paths:
      - 'desktop/employee-config-switcher/preflight/**'
      - '.github/workflows/employee-secret-service-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/employee-config-switcher/preflight/**'
      - '.github/workflows/employee-secret-service-preflight.yml'

permissions:
  contents: read

concurrency:
  group: secret-service-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-key-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Check metadata-only fixture guards
        run: python3 -B desktop/employee-config-switcher/preflight/test_preflight.py
      - name: Install exact distro components (missing versions fail)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          mapfile -t pins < <(python3 -c 'import json; d=json.load(open("desktop/employee-config-switcher/preflight/components.json")); print("\n".join(k+"="+v["version"] for k,v in d.items()))')
          test "${#pins[@]}" -eq 4
          sudo apt-get install --no-install-recommends -y "${pins[@]}" gcc pkg-config
      - name: Run disposable metadata-only isolation preflight
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 desktop/employee-config-switcher/preflight/run.py
