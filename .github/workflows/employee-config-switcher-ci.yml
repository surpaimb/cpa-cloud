name: Employee config switcher validation

on:
  push:
    branches: [codex/employee-native-switcher]
    paths:
      - "desktop/employee-config-switcher/**"
      - ".github/workflows/employee-config-switcher-ci.yml"
  pull_request:
    paths:
      - "desktop/employee-config-switcher/**"
      - ".github/workflows/employee-config-switcher-ci.yml"

permissions:
  contents: read

concurrency:
  group: employee-config-switcher-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/employee-config-switcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/employee-config-switcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt
          rustup default 1.90.0
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p employee-config-core

  native-check:
    name: Tauri check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: desktop/employee-config-switcher
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          rustup default 1.90.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.0
      - name: Build pinned frontend assets
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - run: cargo check --locked -p cpa-cloud-employee-config
