name: Code validation

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

concurrency:
  group: code-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      core: ${{ steps.plan.outputs.core }}
      web: ${{ steps.plan.outputs.web }}
      windows: ${{ steps.plan.outputs.windows }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci-plan.py --base "$BASE"
      - run: python3 scripts/test-ci-plan.py

  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The full non-cached integration suite remains in core. The complete
      # service race suite runs in separate, audited matrix shards below.
      - run: go test ./... -count=1 -timeout=15m
      - name: Race-check stateful capability packages
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/backup ./internal/keyprovider ./internal/recoverymaterial ./internal/membership ./internal/scheduling ./internal/accounting ./internal/financial ./internal/egress ./internal/governance ./internal/keypolicy ./internal/protocolconv -count=1 -timeout=15m
      - run: go vet ./...
      - run: go build -trimpath -o "$RUNNER_TEMP/cpa-cloud" ./cmd/cpa-cloud
      - run: go build -trimpath -o "$RUNNER_TEMP/cpa-cloud-backup" ./cmd/cpa-cloud-backup
      - name: Test manual monthly renewal against an isolated process
        run: node scripts/smoke-subscription-renewal.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee wallet balance against an isolated process
        run: node scripts/smoke-employee-self-wallet-balance.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee self redemption against an isolated process
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/employee-self-redemption
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: node scripts/smoke-employee-self-redemption.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee wallet activity against an isolated process
        run: node scripts/smoke-employee-self-wallet-activity.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee wallet entry classifications against an isolated process
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/employee-wallet-entry-classifications
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: node scripts/smoke-employee-self-wallet-entry-classification.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee self redemption credit history against an isolated process
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/employee-self-redemption-credit-history
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: node scripts/smoke-employee-self-redemption-credit-history.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee subscription status against an isolated process
        run: node scripts/smoke-employee-self-subscription-status.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee self-cancellation against an isolated process
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/employee-self-cancel
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: node scripts/smoke-employee-self-subscription-cancel.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee one-shot disarm against an isolated process
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/employee-self-one-shot
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: node scripts/smoke-employee-self-one-shot-disarm.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee plan catalog against an isolated process
        run: node scripts/smoke-employee-self-plan-catalog.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in employee monthly renewal against an isolated process
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/employee-self-monthly-renewal
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: node scripts/smoke-employee-self-monthly-renewal.mjs "$RUNNER_TEMP/cpa-cloud" "$(command -v go)"
      - name: Test opt-in employee renewal links against an isolated process
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/employee-self-renewal-links
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: node scripts/smoke-employee-self-renewal-links.mjs "$RUNNER_TEMP/cpa-cloud" "$(command -v go)"
      - name: Test local account-pool reservation snapshot with synthetic traffic
        run: node scripts/smoke-account-pool.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test bounded four-source administrator audit overview
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/admin-audit
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: node scripts/smoke-admin-audit.mjs "$RUNNER_TEMP/cpa-cloud" "$GITHUB_WORKSPACE/web"
      - name: Test default-off governance and atomic lifecycle with synthetic traffic
        run: node scripts/smoke-governance.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test governance observations with isolated synthetic usage
        run: node scripts/smoke-governance-observations.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test proxy storage and restart without outbound requests
        run: node scripts/smoke-outbound-proxy.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test upstream health with isolated synthetic providers
        run: node scripts/smoke-upstream-health.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in channel monitors with an isolated synthetic catalog
        env:
          CPA_CLOUD_ACCEPTANCE_TEMP_ROOT: ${{ runner.temp }}/channel-monitors
          CPA_CLOUD_ACCEPTANCE_FORBID_PORT: '8787'
        run: |
          mkdir -p "$CPA_CLOUD_ACCEPTANCE_TEMP_ROOT"
          node scripts/smoke-channel-monitors.mjs "$RUNNER_TEMP/cpa-cloud" "$GITHUB_WORKSPACE/web"
      - name: Test recovery storage and isolation without an automatic generation worker
        run: node scripts/smoke-recovery-foundations.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test opt-in automatic recovery with isolated synthetic providers
        run: node scripts/smoke-account-recovery.mjs "$RUNNER_TEMP/cpa-cloud"
      - name: Test lifecycle, scheduled tests, and encrypted restore in isolated processes
        run: node scripts/verify-next-batch.mjs --server "$RUNNER_TEMP/cpa-cloud" --backup "$RUNNER_TEMP/cpa-cloud-backup" --web-dir "$GITHUB_WORKSPACE/web"

  race-service:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Enumerate and verify complete disjoint service race shards
        id: cases
        env:
          CGO_ENABLED: '1'
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: python3 scripts/ci-plan-service-race.py --shard-index "$SHARD_INDEX" --shard-count 4
      - name: Race-check service shard ${{ matrix.shard }}
        env:
          CGO_ENABLED: '1'
          TEST_REGEX: ${{ steps.cases.outputs.regex }}
          CASE_COUNT: ${{ steps.cases.outputs.case_count }}
        run: |
          test "$CASE_COUNT" -gt 0
          go test -race ./internal/service -count=1 -timeout=60m -run "$TEST_REGEX"

  web:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build

  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    uses: ./.github/workflows/preview-release.yml
    with:
      platform: windows

  linux:
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    uses: ./.github/workflows/preview-release.yml
    with:
      platform: linux

  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    uses: ./.github/workflows/preview-release.yml
    with:
      platform: macos
