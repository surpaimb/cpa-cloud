name: Native package validation
on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate; does not publish a Release
        type: choice
        options: [all, windows, linux, macos]
        default: all
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0-preview.3' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: select
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: python3 scripts/ci-plan.py --platform "$PLATFORM"

  web:
    name: Build and review web payload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate preview tag
        run: go run ./scripts/release-package.go validate-tag

      - name: Install locked web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test and build web console
        working-directory: web
        run: |
          bun run typecheck
          bun run test
          bun run build

      - name: Collect web payload and runtime license texts
        run: go run ./scripts/release-package.go web-assets --source . --output release-web

      - name: Upload validated web payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-web-assets-${{ inputs.platform }}
          path: release-web
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.asset_os }} ${{ matrix.goarch }}
    needs: [web, plan]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download validated web payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-web-assets-${{ inputs.platform }}
          path: release-web

      - name: Run native Go tests
        run: go test ./... -count=1 -timeout=2m

      - name: Build native package and collect license texts
        run: go run ./scripts/release-package.go package --source . --web-assets release-web --output release-out --target-os "${{ matrix.goos }}" --target-arch "${{ matrix.goarch }}" --asset-os "${{ matrix.asset_os }}"

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ matrix.asset_os }}-${{ matrix.goarch }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 1

  windows-installer:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    name: Build Windows ${{ matrix.arch }} installers
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            asset_os: windows
            arch: amd64
            dotnet_arch: x64
            portable_glob: "*.zip"
          - runner: windows-11-arm
            asset_os: windows
            arch: arm64
            dotnet_arch: arm64
            portable_glob: "*.zip"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download matching portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: installer-input

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
          architecture: ${{ matrix.dotnet_arch }}

      - name: Test Windows launcher
        shell: pwsh
        run: dotnet run --project desktop/windows/CPACloud.Launcher.csproj -c Release -- --self-test

      - name: Download and verify NSIS 3.12
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.12.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'nsis-3.12'
          $expected = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          $urls = @(
            'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip',
            'https://mirrors.mit.edu/macports/distfiles/nsis/nsis-3.12.zip'
          )
          $actual = ''
          foreach ($url in $urls) {
            try { Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 60 } catch { continue }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($actual -eq $expected) { break }
          }
          if ($actual -ne $expected) {
            throw "No NSIS download matched the canonical SHA-256; last hash: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $nsisRoot = Join-Path $extract 'nsis-3.12'
          if (-not (Test-Path -LiteralPath (Join-Path $nsisRoot 'makensis.exe') -PathType Leaf)) {
            throw 'Verified NSIS archive has an unexpected layout.'
          }
          "NSIS_ROOT=$nsisRoot" >> $env:GITHUB_ENV

      - name: Install pinned WiX Toolset 4.0.6
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'wix-4.0.6'
          dotnet tool install wix --tool-path $toolRoot --version 4.0.6
          $wix = Join-Path $toolRoot 'wix.exe'
          $reported = (& $wix --version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $reported.StartsWith('4.0.6')) {
            throw "Unexpected WiX version: $reported"
          }
          "WIX_EXE=$wix" >> $env:GITHUB_ENV

      - name: Build per-user Windows Setup and MSI
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath installer-input -Filter '${{ matrix.portable_glob }}' -File)
          $checksums = @(Get-ChildItem -LiteralPath installer-input -Filter '*.sha256' -File)
          if ($archives.Count -ne 1 -or $checksums.Count -ne 1) { throw 'Expected one portable archive and one checksum.' }
          ./scripts/release-windows-installer.ps1 -Source . -PortableArchive $archives[0].FullName -PortableChecksum $checksums[0].FullName -Output installer-out -Version $env:RELEASE_TAG -Arch '${{ matrix.arch }}' -NSISRoot $env:NSIS_ROOT -WixExecutable $env:WIX_EXE

      - name: Test Windows install, upgrade, refusal, and uninstall lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath installer-out -Filter '*_Setup.exe' -File)
          $checksums = @(Get-ChildItem -LiteralPath installer-out -Filter '*_Setup.exe.sha256' -File)
          if ($installers.Count -ne 1 -or $checksums.Count -ne 1) { throw 'Expected one installer and one checksum.' }
          ./scripts/release-windows-installer-acceptance.ps1 -Installer $installers[0].FullName -InstallerChecksum $checksums[0].FullName -Version $env:RELEASE_TAG

      - name: Test Windows MSI install, reinstall, and uninstall lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath installer-out -Filter '*.msi' -File)
          $checksums = @(Get-ChildItem -LiteralPath installer-out -Filter '*.msi.sha256' -File)
          $setups = @(Get-ChildItem -LiteralPath installer-out -Filter '*_Setup.exe' -File)
          if ($installers.Count -ne 1 -or $checksums.Count -ne 1 -or $setups.Count -ne 1) { throw 'Expected one MSI, one MSI checksum, and one Setup installer.' }
          ./scripts/release-windows-msi-acceptance.ps1 -Installer $installers[0].FullName -InstallerChecksum $checksums[0].FullName -SetupInstaller $setups[0].FullName

      - name: Upload Windows installer assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-windows-${{ matrix.arch }}
          path: installer-out/*
          if-no-files-found: error
          retention-days: 1

  linux-installer:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    name: Build Linux ${{ matrix.arch }} installers
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            tool_arch: x86_64
            tool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
          - runner: ubuntu-24.04-arm
            arch: arm64
            tool_arch: aarch64
            tool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 7d5d772b7c32f0c84caf0a452a3072a5709027d7eac5856feb89a7a7a8881372
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download matching portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-linux-${{ matrix.arch }}
          path: installer-input

      - name: Install native package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Test Linux launcher ownership checks
        run: ./scripts/test-linux-launcher.sh

      - name: Download and verify AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-${{ matrix.tool_arch }}.AppImage"
          runtime="$RUNNER_TEMP/runtime-${{ matrix.tool_arch }}"
          curl --fail --location --retry 3 --output "$tool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.tool_arch }}.AppImage"
          curl --fail --location --retry 3 --output "$runtime" "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.tool_arch }}"
          echo "${{ matrix.tool_sha256 }}  $tool" | sha256sum -c -
          echo "${{ matrix.runtime_sha256 }}  $runtime" | sha256sum -c -
          chmod 755 "$tool" "$runtime"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Build and inspect AppImage, deb, and rpm
        shell: bash
        run: |
          set -euo pipefail
          archives=(installer-input/*.tar.gz)
          checksums=(installer-input/*.sha256)
          test "${#archives[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          ./scripts/release-linux-installers.sh --source . --portable-archive "${archives[0]}" --portable-checksum "${checksums[0]}" --output installer-out --version "$RELEASE_TAG" --arch "${{ matrix.arch }}" --appimagetool "$APPIMAGETOOL" --appimage-runtime "$APPIMAGE_RUNTIME"

      - name: Upload Linux installer assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-linux-${{ matrix.arch }}
          path: installer-out/*
          if-no-files-found: error
          retention-days: 1

  macos-installer:
    if: inputs.platform == 'all' || inputs.platform == 'macos'
    name: Build macOS Universal installers
    needs: package
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download amd64 portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-macos-amd64
          path: installer-input/amd64

      - name: Download arm64 portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-macos-arm64
          path: installer-input/arm64

      - name: Test macOS launcher
        run: swift test --package-path desktop/macos

      - name: Build and inspect Universal app DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          amd64_archives=(installer-input/amd64/*.tar.gz)
          amd64_checksums=(installer-input/amd64/*.sha256)
          arm64_archives=(installer-input/arm64/*.tar.gz)
          arm64_checksums=(installer-input/arm64/*.sha256)
          test "${#amd64_archives[@]}" -eq 1
          test "${#amd64_checksums[@]}" -eq 1
          test "${#arm64_archives[@]}" -eq 1
          test "${#arm64_checksums[@]}" -eq 1
          ./scripts/release-macos-universal.sh --source . --portable-amd64-archive "${amd64_archives[0]}" --portable-amd64-checksum "${amd64_checksums[0]}" --portable-arm64-archive "${arm64_archives[0]}" --portable-arm64-checksum "${arm64_checksums[0]}" --output installer-out --version "$RELEASE_TAG"

      - name: Upload macOS installer assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-macos-universal
          path: installer-out/*
          if-no-files-found: error
          retention-days: 1
