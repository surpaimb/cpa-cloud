name: Preview release

on:
  push:
    branches:
      - main
    tags:
      - "v*-preview.*"
    paths:
      - ".github/workflows/preview-release.yml"
      - "cmd/**"
      - "desktop/**"
      - "docs/**"
      - "internal/**"
      - "packaging/**"
      - "scripts/release*"
      - "web/**"
      - "go.mod"
      - "go.sum"
      - "LICENSE*"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: preview-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0-preview.2' }}

jobs:
  web:
    name: Build and review web payload
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Validate preview tag
        run: go run ./scripts/release-package.go validate-tag

      - name: Install locked web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test and build web console
        working-directory: web
        run: |
          bun run typecheck
          bun run test
          bun run build

      - name: Collect web payload and runtime license texts
        run: go run ./scripts/release-package.go web-assets --source . --output release-web

      - name: Upload validated web payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-web-assets
          path: release-web
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package ${{ matrix.asset_os }} ${{ matrix.goarch }}
    needs: web
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            goos: windows
            asset_os: windows
            goarch: amd64
          - runner: windows-11-arm
            goos: windows
            asset_os: windows
            goarch: arm64
          - runner: ubuntu-24.04
            goos: linux
            asset_os: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            asset_os: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            asset_os: macos
            goarch: amd64
          - runner: macos-15
            goos: darwin
            asset_os: macos
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download validated web payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-web-assets
          path: release-web

      - name: Run native Go tests
        run: go test ./... -count=1 -timeout=2m

      - name: Build native package and collect license texts
        run: go run ./scripts/release-package.go package --source . --web-assets release-web --output release-out --target-os "${{ matrix.goos }}" --target-arch "${{ matrix.goarch }}" --asset-os "${{ matrix.asset_os }}"

      - name: Upload release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ matrix.asset_os }}-${{ matrix.goarch }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 1

  windows-installer:
    name: Build Windows ${{ matrix.arch }} installers
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            asset_os: windows
            arch: amd64
            dotnet_arch: x64
            portable_glob: "*.zip"
          - runner: windows-11-arm
            asset_os: windows
            arch: arm64
            dotnet_arch: arm64
            portable_glob: "*.zip"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download matching portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: installer-input

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
          architecture: ${{ matrix.dotnet_arch }}

      - name: Test Windows launcher
        shell: pwsh
        run: dotnet run --project desktop/windows/CPACloud.Launcher.csproj -c Release -- --self-test

      - name: Download and verify NSIS 3.12
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nsis-3.12.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'nsis-3.12'
          $expected = '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f'
          $urls = @(
            'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip',
            'https://mirrors.mit.edu/macports/distfiles/nsis/nsis-3.12.zip'
          )
          $actual = ''
          foreach ($url in $urls) {
            try { Invoke-WebRequest -Uri $url -OutFile $archive -TimeoutSec 60 } catch { continue }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
            if ($actual -eq $expected) { break }
          }
          if ($actual -ne $expected) {
            throw "No NSIS download matched the canonical SHA-256; last hash: $actual"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $nsisRoot = Join-Path $extract 'nsis-3.12'
          if (-not (Test-Path -LiteralPath (Join-Path $nsisRoot 'makensis.exe') -PathType Leaf)) {
            throw 'Verified NSIS archive has an unexpected layout.'
          }
          "NSIS_ROOT=$nsisRoot" >> $env:GITHUB_ENV

      - name: Install pinned WiX Toolset 4.0.6
        shell: pwsh
        run: |
          $toolRoot = Join-Path $env:RUNNER_TEMP 'wix-4.0.6'
          dotnet tool install wix --tool-path $toolRoot --version 4.0.6
          $wix = Join-Path $toolRoot 'wix.exe'
          $reported = (& $wix --version).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $reported.StartsWith('4.0.6')) {
            throw "Unexpected WiX version: $reported"
          }
          "WIX_EXE=$wix" >> $env:GITHUB_ENV

      - name: Build per-user Windows Setup and MSI
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath installer-input -Filter '${{ matrix.portable_glob }}' -File)
          $checksums = @(Get-ChildItem -LiteralPath installer-input -Filter '*.sha256' -File)
          if ($archives.Count -ne 1 -or $checksums.Count -ne 1) { throw 'Expected one portable archive and one checksum.' }
          ./scripts/release-windows-installer.ps1 -Source . -PortableArchive $archives[0].FullName -PortableChecksum $checksums[0].FullName -Output installer-out -Version $env:RELEASE_TAG -Arch '${{ matrix.arch }}' -NSISRoot $env:NSIS_ROOT -WixExecutable $env:WIX_EXE

      - name: Test Windows install, upgrade, refusal, and uninstall lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath installer-out -Filter '*_Setup.exe' -File)
          $checksums = @(Get-ChildItem -LiteralPath installer-out -Filter '*_Setup.exe.sha256' -File)
          if ($installers.Count -ne 1 -or $checksums.Count -ne 1) { throw 'Expected one installer and one checksum.' }
          ./scripts/release-windows-installer-acceptance.ps1 -Installer $installers[0].FullName -InstallerChecksum $checksums[0].FullName -Version $env:RELEASE_TAG

      - name: Test Windows MSI install, reinstall, and uninstall lifecycle
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath installer-out -Filter '*.msi' -File)
          $checksums = @(Get-ChildItem -LiteralPath installer-out -Filter '*.msi.sha256' -File)
          $setups = @(Get-ChildItem -LiteralPath installer-out -Filter '*_Setup.exe' -File)
          if ($installers.Count -ne 1 -or $checksums.Count -ne 1 -or $setups.Count -ne 1) { throw 'Expected one MSI, one MSI checksum, and one Setup installer.' }
          ./scripts/release-windows-msi-acceptance.ps1 -Installer $installers[0].FullName -InstallerChecksum $checksums[0].FullName -SetupInstaller $setups[0].FullName

      - name: Upload Windows installer assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-windows-${{ matrix.arch }}
          path: installer-out/*
          if-no-files-found: error
          retention-days: 1

  linux-installer:
    name: Build Linux ${{ matrix.arch }} installers
    needs: package
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            tool_arch: x86_64
            tool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
            runtime_sha256: 1cc49bcf1e2ccd593c379adb17c9f85a36d619088296504de95b1d06215aebbf
          - runner: ubuntu-24.04-arm
            arch: arm64
            tool_arch: aarch64
            tool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
            runtime_sha256: 7d5d772b7c32f0c84caf0a452a3072a5709027d7eac5856feb89a7a7a8881372
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download matching portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-linux-${{ matrix.arch }}
          path: installer-input

      - name: Install native package inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Test Linux launcher ownership checks
        run: ./scripts/test-linux-launcher.sh

      - name: Download and verify AppImage tooling
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/appimagetool-${{ matrix.tool_arch }}.AppImage"
          runtime="$RUNNER_TEMP/runtime-${{ matrix.tool_arch }}"
          curl --fail --location --retry 3 --output "$tool" "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-${{ matrix.tool_arch }}.AppImage"
          curl --fail --location --retry 3 --output "$runtime" "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.tool_arch }}"
          echo "${{ matrix.tool_sha256 }}  $tool" | sha256sum -c -
          echo "${{ matrix.runtime_sha256 }}  $runtime" | sha256sum -c -
          chmod 755 "$tool" "$runtime"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$runtime" >> "$GITHUB_ENV"

      - name: Build and inspect AppImage, deb, and rpm
        shell: bash
        run: |
          set -euo pipefail
          archives=(installer-input/*.tar.gz)
          checksums=(installer-input/*.sha256)
          test "${#archives[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          ./scripts/release-linux-installers.sh --source . --portable-archive "${archives[0]}" --portable-checksum "${checksums[0]}" --output installer-out --version "$RELEASE_TAG" --arch "${{ matrix.arch }}" --appimagetool "$APPIMAGETOOL" --appimage-runtime "$APPIMAGE_RUNTIME"

      - name: Upload Linux installer assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-linux-${{ matrix.arch }}
          path: installer-out/*
          if-no-files-found: error
          retention-days: 1

  macos-installer:
    name: Build macOS Universal installers
    needs: package
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download amd64 portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-macos-amd64
          path: installer-input/amd64

      - name: Download arm64 portable package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: package-macos-arm64
          path: installer-input/arm64

      - name: Test macOS launcher
        run: swift test --package-path desktop/macos

      - name: Build and inspect Universal app DMG and ZIP
        shell: bash
        run: |
          set -euo pipefail
          amd64_archives=(installer-input/amd64/*.tar.gz)
          amd64_checksums=(installer-input/amd64/*.sha256)
          arm64_archives=(installer-input/arm64/*.tar.gz)
          arm64_checksums=(installer-input/arm64/*.sha256)
          test "${#amd64_archives[@]}" -eq 1
          test "${#amd64_checksums[@]}" -eq 1
          test "${#arm64_archives[@]}" -eq 1
          test "${#arm64_checksums[@]}" -eq 1
          ./scripts/release-macos-universal.sh --source . --portable-amd64-archive "${amd64_archives[0]}" --portable-amd64-checksum "${amd64_checksums[0]}" --portable-arm64-archive "${arm64_archives[0]}" --portable-arm64-checksum "${arm64_checksums[0]}" --output installer-out --version "$RELEASE_TAG"

      - name: Upload macOS installer assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: installer-macos-universal
          path: installer-out/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-preview.')
    needs: [package, windows-installer, linux-installer, macos-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all native packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Download all desktop installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: Verify package sidecars and create aggregate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          portables=(
            cpa-cloud_*_windows_amd64.zip
            cpa-cloud_*_windows_arm64.zip
            cpa-cloud_*_linux_amd64.tar.gz
            cpa-cloud_*_linux_arm64.tar.gz
            cpa-cloud_*_macos_amd64.tar.gz
            cpa-cloud_*_macos_arm64.tar.gz
          )
          installers=(
            cpa-cloud_*_windows_amd64_Setup.exe
            cpa-cloud_*_windows_arm64_Setup.exe
            cpa-cloud_*_windows_amd64.msi
            cpa-cloud_*_windows_arm64.msi
            cpa-cloud_*_linux_amd64.AppImage
            cpa-cloud_*_linux_arm64.AppImage
            cpa-cloud_*_linux_amd64.deb
            cpa-cloud_*_linux_arm64.deb
            cpa-cloud_*_linux_amd64.rpm
            cpa-cloud_*_linux_arm64.rpm
            cpa-cloud_*_macos_universal.dmg
            cpa-cloud_*_macos_universal.zip
          )
          sidecars=(cpa-cloud_*.sha256)
          test "${#portables[@]}" -eq 6
          test "${#installers[@]}" -eq 12
          test "${#sidecars[@]}" -eq 18
          for sidecar in "${sidecars[@]}"; do sha256sum -c "$sidecar"; done
          sha256sum "${portables[@]}" "${installers[@]}" > SHA256SUMS.txt

      - name: Create or update GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## 开发预览 / Development preview

          本 Release 提供十八个产物：保留 Windows、Linux、macOS 的 amd64/arm64 六个便携包；Windows amd64/arm64 同时提供经过完整生命周期验收的 NSIS `Setup.exe` 和经过安装/重装/卸载验收的 MSI；Linux amd64/arm64 提供 AppImage、deb 和 rpm；macOS 提供同时包含 Intel 与 Apple Silicon 代码的 Universal DMG 和 ZIP。Windows 安装包包含自包含 .NET 启动器。Linux 桌面入口在终端中管理本机服务并打开浏览器。macOS DMG 内含标准 `CPA Cloud.app` 和 Applications 链接。升级与卸载不删除用户数据。所有主产物均带独立 SHA-256 sidecar，并汇总到 `SHA256SUMS.txt`。

          当前仅实现 OpenAI-compatible API Key 上游和 Chat Completions。会员账号、Responses、Messages、账号池与生产级运维尚未实现。工作流在对应架构 runner 上执行 Go 测试、启动器测试、构建、包结构检查和二进制检查；这不等同于真实目标机器上的完整部署验收。Windows 安装程序、Linux 包和 macOS App 均未签名，macOS App/DMG 未经 notarization；首次运行可能触发系统安全提示。应用内自动更新尚未实现，`.sig` 不会在缺少验证链路时生成。

          This prerelease provides eighteen artifacts. It retains six amd64/arm64 portable packages for Windows, Linux, and macOS. Windows amd64/arm64 each receive a fully lifecycle-tested NSIS `Setup.exe` and an install/reinstall/uninstall-tested MSI. Linux amd64/arm64 receive AppImage, deb, and rpm packages. macOS receives Universal DMG and ZIP packages containing both Intel and Apple Silicon code. Windows packages contain the self-contained .NET launcher. The Linux desktop entry hosts the local service in a terminal and opens a browser. The DMG contains `CPA Cloud.app` and an Applications link. Upgrade and uninstall preserve user data. Every primary artifact has a SHA-256 sidecar and is included in `SHA256SUMS.txt`.

          The implemented scope is limited to OpenAI-compatible API-key upstreams and Chat Completions. Membership accounts, Responses, Messages, account pools, and production operations are not implemented. The workflow runs Go and launcher tests, builds, package-structure validation, and binary checks on matching architecture runners; this is not a claim of complete deployment validation on end-user machines. Windows installers, Linux packages, and the macOS app are unsigned, and the macOS app/DMG is not notarized; first launch may trigger platform security warnings. In-app updates are not implemented, so `.sig` files are not emitted without a real verification path.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --prerelease --title "CPA Cloud $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --notes-file release-notes.md --title "CPA Cloud $RELEASE_TAG"
          fi
