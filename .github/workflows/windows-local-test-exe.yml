name: Windows local test executable

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/windows-local-test-exe.yml'
      - 'docs/windows-local-test-exe-contract.md'

permissions:
  contents: read

jobs:
  windows-test-exe:
    if: github.run_attempt == 1 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up frozen Go patch version
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache: false

      - name: Build and inspect one API-only local-test executable
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_HEAD -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source identity' }
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:EXPECTED_HEAD) { throw 'Source identity mismatch' }
          $toolchain = go version
          if ($LASTEXITCODE -ne 0 -or $toolchain -cne 'go version go1.26.9 windows/amd64') { throw 'Toolchain mismatch' }
          $out = Join-Path $env:RUNNER_TEMP 'cpa-cloud-local-test'
          if (Test-Path -LiteralPath $out) { throw 'Output directory already exists' }
          $null = New-Item -ItemType Directory -Path $out
          $exe = Join-Path $out 'cpa-cloud.exe'
          $version = 'local-test-' + $head
          go build -trimpath -ldflags "-X main.version=$version" -o $exe ./cmd/cpa-cloud
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $items = @(Get-ChildItem -LiteralPath $out -Force)
          if ($items.Count -ne 1 -or $items[0].Name -cne 'cpa-cloud.exe' -or $items[0].PSIsContainer -or ($items[0].Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Expected one regular executable' }
          $size = $items[0].Length
          if ($size -lt 64 -or $size -gt 256MB) { throw 'Unexpected executable size' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($pe -lt 64 -or $pe -gt ($bytes.Length - 26)) { throw 'Invalid PE offset' }
          if ([BitConverter]::ToUInt16($bytes, 0) -ne 0x5a4d -or [BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664 -or [BitConverter]::ToUInt16($bytes, $pe + 24) -ne 0x20b) { throw 'Expected PE32+ AMD64' }
          $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes))
          $probe = Join-Path $env:RUNNER_TEMP 'cpa-cloud-help-must-not-exist'
          if (Test-Path -LiteralPath $probe) { throw 'Help data probe already exists' }
          $helpText = (& $exe --data-dir $probe --help 2>&1) -join [Environment]::NewLine
          if ($LASTEXITCODE -ne 0 -or $helpText -notmatch 'Usage of cpa-cloud:' -or (Test-Path -LiteralPath $probe)) { throw 'CLI help smoke failed' }
          $items = @(Get-ChildItem -LiteralPath $out -Force)
          if ($items.Count -ne 1 -or $items[0].Name -cne 'cpa-cloud.exe' -or $items[0].PSIsContainer -or ($items[0].Attributes -band [IO.FileAttributes]::ReparsePoint) -or $items[0].Length -ne $size -or (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash -cne $sha) { throw 'Output changed after help smoke' }
          $summary = @(
            '# Windows local-test executable'
            "Source HEAD: $head"
            "Toolchain: $toolchain"
            'Target: windows/amd64; CGO_ENABLED=0'
            "Version: $version"
            "File: cpa-cloud.exe; bytes: $size; SHA256: $sha"
            'PE32+ AMD64 and CLI help passed; no HTTP or full-suite acceptance.'
            'API/CLI-only; no bundled web console or backup CLI. Local testing only; production NO-GO.'
          )
          $summary | Write-Output
          $summary | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload only the executable, without an archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cpa-cloud.exe
          path: ${{ runner.temp }}/cpa-cloud-local-test/cpa-cloud.exe
          archive: false
          retention-days: 7
          if-no-files-found: error
