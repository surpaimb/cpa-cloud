# Independently authored B1a-C synthetic channel only; see its PROVENANCE.md.
name: Employee Secret Service synthetic password channel C

on:
  pull_request:
    paths:
      - 'tests/secret-service-b1a-channel/**'
      - 'desktop/employee-config-switcher/preflight/**'
      - '.github/workflows/secret-service-b1a-channel.yml'
  push:
    branches: [main]
    paths:
      - 'tests/secret-service-b1a-channel/**'
      - 'desktop/employee-config-switcher/preflight/**'
      - '.github/workflows/secret-service-b1a-channel.yml'

permissions:
  contents: read

concurrency:
  group: secret-service-b1a-channel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-channel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Public offline C tests
        run: python3 -B tests/secret-service-b1a-channel/test_channel.py
      - name: Install private bus executable only
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-daemon=1.14.10-4ubuntu4.1
          test "$(dpkg-query -W -f='${Version}' dbus-daemon)" = 1.14.10-4ubuntu4.1
          test -f /usr/share/doc/dbus-daemon/copyright
      - name: Isolated synthetic receiver channel acceptance (not GNOME)
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 -B tests/secret-service-b1a-channel/fixture.py
