name: Secret Service no-secret persistent-directory B0

on:
  pull_request:
    paths:
      - 'tests/secret-service-persistent-b0/**'
      - 'desktop/employee-config-switcher/preflight/**'
      - '.github/workflows/secret-service-persistent-b0.yml'
  push:
    branches: [main]
    paths:
      - 'tests/secret-service-persistent-b0/**'
      - 'desktop/employee-config-switcher/preflight/**'
      - '.github/workflows/secret-service-persistent-b0.yml'

permissions:
  contents: read

concurrency:
  group: secret-service-persistent-b0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-secret-b0:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Static guards and public filesystem negative tests
        run: |
          python3 -B desktop/employee-config-switcher/preflight/test_preflight.py
          python3 -B tests/secret-service-persistent-b0/test_fixture.py --linux-fs
      - name: Install exact real components (missing versions fail)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          mapfile -t pins < <(python3 -c 'import json; d=json.load(open("desktop/employee-config-switcher/preflight/components.json")); print("\n".join(k+"="+v["version"] for k,v in d.items()))')
          test "${#pins[@]}" -eq 4
          sudo apt-get install --no-install-recommends -y "${pins[@]}" gcc pkg-config
      - name: No-secret directory and owned service restart only
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 -B tests/secret-service-persistent-b0/fixture.py
