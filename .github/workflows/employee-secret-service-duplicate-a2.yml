name: Employee Secret Service duplicate rejection A2

on:
  pull_request:
    paths:
      - 'desktop/employee-config-switcher/**'
      - '.github/workflows/employee-secret-service-duplicate-a2.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/employee-config-switcher/**'
      - '.github/workflows/employee-secret-service-duplicate-a2.yml'

permissions:
  contents: read

concurrency:
  group: secret-service-a2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  duplicate-rejection:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Static no-key, volatile and A2 guards
        run: |
          python3 -B desktop/employee-config-switcher/preflight/test_preflight.py
          python3 -B desktop/employee-config-switcher/interop/test_fixture.py
          python3 -B desktop/employee-config-switcher/interop-a2/test_fixture.py
      - name: Install exact real components (missing versions fail)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          mapfile -t pins < <(python3 -c 'import json; d=json.load(open("desktop/employee-config-switcher/preflight/components.json")); print("\n".join(k+"="+v["version"] for k,v in d.items()))')
          test "${#pins[@]}" -eq 4
          sudo apt-get install --no-install-recommends -y "${pins[@]}" gcc pkg-config libdbus-1-dev
      - name: Compile independent helper and exercise public-only predicates
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror desktop/employee-config-switcher/interop-a2/duplicate.c -o "$RUNNER_TEMP/cpa-a2-helper-check" $(pkg-config --cflags --libs libsecret-1)
          CPA_A2_HELPER_SELF_TEST="$RUNNER_TEMP/cpa-a2-helper-check" python3 -B desktop/employee-config-switcher/interop-a2/test_fixture.py
      - name: Compile actual CPA provider test executable without running it
        working-directory: desktop/employee-config-switcher
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 test --locked -p employee-config-core --lib --no-run --message-format=json > "$RUNNER_TEMP/cpa-fixture-build.jsonl"
      - name: Run explicit disposable synthetic A2 fixture
        shell: bash
        run: |
          set -euo pipefail
          binary=$(python3 desktop/employee-config-switcher/interop/select_binary.py "$RUNNER_TEMP/cpa-fixture-build.jsonl")
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS python3 -B desktop/employee-config-switcher/interop-a2/fixture.py "$binary"
